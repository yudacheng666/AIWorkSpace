name: tests

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Set up Node.js for UI regression test
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run new-task draft regression tests
        run: node --test tests/test_create_ui.mjs
